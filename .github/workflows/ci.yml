name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Protect CHANGELOG on pull requests
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md may only be changed by npm run release."
            exit 1
          fi

      - name: Protect CHANGELOG on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Skipping CHANGELOG guard for a new branch."
            exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -qx 'CHANGELOG.md'; then
            git fetch --tags --force
            VERSION="$(node -p "require('./manifest.json').version")"
            if ! git tag --points-at HEAD | grep -qx "v$VERSION"; then
              echo "CHANGELOG.md may only be changed by npm run release (the release commit must be tagged v$VERSION)."
              exit 1
            fi
          fi
